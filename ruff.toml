line-length = 88
preview = true

[lint]
# D = pydocstyle (remplacement de pydocstyle/docstring-checker)
select = ["D", "DOC"]

# Résolution des règles en conflit — choisir une convention
ignore = [
    "D203",  # conflit avec D211 (pas de ligne vide avant docstring de classe)
    "D212",  # conflit avec D213 (résumé sur la 2e ligne)
    "D401",  # Très strict, s'assure de la forme de la docstring (imperative mood, ...)
]

fixable = ["D"]

[lint.pydocstyle]
convention = "google"  # ou "pep257" / "numpy" selon votre style

[lint.per-file-ignores]
"tests/**"   = ["D100", "D101", "D102", "D103", "D104"]
"__init__.py" = ["D104"]
